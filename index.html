<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Бақылау</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#1565c0">
<style>
:root{
  --bg:#e8f2fc; --surface:#ffffff; --ink:#0f2742; --muted:#3e5873; --line:#c9ddf2;
  --accent:#1565c0; --accent-soft:#dbeafe;
  --red:#b4470a; --red-soft:#ffe6d1; --amber:#4b2fb8; --amber-soft:#ebe6fb; --green:#4a6580; --green-soft:#e6edf4;
  --sans:-apple-system,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;
  --mono:ui-monospace,"Roboto Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;letter-spacing:.005em;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:110px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:19px;font-weight:700;margin:0}
.hbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:4px 8px;font:inherit;font-size:12px;cursor:pointer}
.sync{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-top:4px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--green)} .dot.wait{background:var(--amber)} .dot.err{background:var(--red)}
.counters{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:8px}
.cnt{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 7px 4px;text-align:left;cursor:pointer;font:inherit;color:inherit;min-width:0}
.cnt b{display:block;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.cnt span{font-size:11px;color:var(--muted);line-height:1.15;display:block}
.cnt.red b{color:var(--red)} .cnt.amber b{color:var(--amber)}
.cnt[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.chips.sub{grid-template-columns:repeat(2,minmax(0,1fr));margin-top:5px;padding:4px;background:var(--accent-soft);border-radius:12px}
.chips[hidden]{display:none}
.chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin-top:8px}
.chips .chip{display:flex;align-items:center;justify-content:center;gap:3px;min-width:0;white-space:nowrap;border-radius:8px;padding:4px 2px;font-size:12px;letter-spacing:-.01em}
.chips .chip small{font-size:11px;margin-left:0}
.chips .chip .nm{overflow:hidden;text-overflow:ellipsis;min-width:0}
.chips.ordg{grid-template-columns:repeat(2,minmax(0,1fr))}
.chips .chip.ord{justify-content:space-between}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 1 auto;max-width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 9px;font:inherit;font-size:13.5px;cursor:pointer;white-space:nowrap}
.chip small{color:var(--muted);margin-left:3px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:#0b3a78;border-color:#0b3a78;color:#fff;font-weight:700;box-shadow:0 2px 6px rgba(11,58,120,.35)}
.chip[aria-pressed="true"] small{color:var(--surface);opacity:.8}
.search{margin-top:10px;width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit}
.list{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.row{display:grid;grid-template-columns:4px 1fr auto;gap:0 8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px 6px 0;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%;overflow:hidden}
.row .bar{background:var(--line)}
.row .bar{width:6px} .row.over .bar{background:var(--red)} .row.soon .bar{background:var(--amber)} .row.done .bar{background:var(--green)}
.row .main{min-width:0}
.row .t{font-weight:600;overflow-wrap:anywhere;font-size:14px;line-height:1.25}
.pri{display:inline-block;font-size:11px;font-weight:700;padding:0 4px;border-radius:4px;margin-right:4px;vertical-align:1px;background:var(--red-soft);color:var(--red)}
.pri.p2{background:var(--amber-soft);color:var(--amber)} .pri.p1{background:var(--accent-soft);color:var(--accent)}
.row .meta{display:flex;flex-wrap:wrap;gap:2px 8px;margin-top:2px;font-size:12px;line-height:1.2;color:var(--muted)}
.row .side{text-align:right;white-space:nowrap;font-size:12px}
.due{font-family:var(--sans);font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;display:block}
.rel{display:inline-block;margin-top:4px;font-size:13px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.over .rel{background:var(--red);color:#fff} .soon .rel{background:var(--amber);color:#fff}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}
.fab{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--surface);font-size:30px;line-height:1;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.sheet{position:fixed;inset:0;background:var(--bg);overflow-y:auto;z-index:20}
.sheet .wrap{padding-bottom:40px}
.sbar{display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;top:0;background:var(--bg);padding-block:8px;z-index:2}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
.btn.pri-b{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.ok{color:var(--green);border-color:var(--green)}
.f{display:flex;flex-direction:column;gap:4px;margin-top:12px}
.f label,.lbl{font-size:13px;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:10px 12px;font:inherit;width:100%}
.f textarea{min-height:180px;resize:vertical;line-height:1.5}
#f_desc{font-size:13px;line-height:1.35;padding:6px 8px;border-radius:7px;min-height:260px}
.ttl{font-size:18px;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.phone{display:flex;gap:6px} .phone input{flex:1;min-width:0}
.steps{display:flex;flex-direction:column;gap:3px;margin-top:6px}
.step{display:grid;grid-template-columns:22px 1fr 26px;align-items:start;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:4px 6px;font-size:13px;line-height:1.3}
.step input[type=checkbox]{width:17px;height:17px;margin:1px 0 0 2px;accent-color:var(--accent)}
.step .st{overflow-wrap:anywhere;padding-top:1px;text-transform:none;letter-spacing:0;font-size:13px;font-weight:400;color:var(--ink);margin:0}
.step.done .st{color:var(--muted);text-decoration:line-through}
.step .x{border:0;background:none;color:var(--muted);font-size:16px;cursor:pointer;line-height:1}
.addstep{display:flex;gap:6px;margin-top:6px} .addstep input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:9px 12px;font:inherit}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.confirm{margin-top:10px;padding:12px;border:1px solid var(--red);border-radius:9px;background:var(--red-soft);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.note{font-size:14px;color:var(--muted);margin-top:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:30}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mv{display:flex;gap:4px;justify-content:center;margin-top:6px}
.mv button,.mvb{border:1px solid var(--line);background:var(--accent-soft);color:var(--accent);border-radius:7px;min-width:34px;height:30px;font:inherit;font-size:16px;font-weight:700;cursor:pointer;padding:0 6px}
.chip.ord{display:inline-flex;align-items:center;gap:6px;padding:3px 4px}
.chip.ord .mvb{height:26px;min-width:28px;font-size:14px}
.row.ord{cursor:default}
.row.ord .side{display:flex;flex-direction:column;gap:4px;justify-content:center}
.hbtns{display:flex;gap:6px}
.hbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.ordhint{margin-top:8px;padding:8px 12px;border-radius:9px;background:var(--accent-soft);color:var(--accent);font-size:13px}
.hl{display:flex;align-items:center;gap:10px}
.burger{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--accent);font-size:20px;cursor:pointer;line-height:1}
.dimmer{position:fixed;inset:0;background:rgba(15,39,66,.35);z-index:25}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(300px,84vw);background:var(--surface);z-index:26;overflow-y:auto;box-shadow:4px 0 24px rgba(0,0,0,.18);padding:calc(14px + env(safe-area-inset-top,0px)) 0 calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-102%);transition:transform .2s}
.drawer.open{transform:none}
.drawer h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 18px 8px}
.ditem{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;border:0;background:none;color:var(--ink);font:inherit;font-size:15px;text-align:left;padding:12px 18px;cursor:pointer}
.ditem small{min-width:28px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 8px}
.ditem.cur{background:var(--accent-soft);color:var(--accent);font-weight:600;box-shadow:inset 4px 0 0 var(--accent)}
.ditem small.z{background:none;color:var(--muted);font-weight:400}
.dsep{height:1px;background:var(--line);margin:8px 18px}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}}
.mvsheet{position:fixed;left:0;right:0;bottom:0;background:var(--surface);z-index:27;border-radius:16px 16px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.18);padding:14px 0 calc(14px + env(safe-area-inset-bottom,0px));max-height:80vh;overflow-y:auto}
.mvsheet h3{margin:0 18px 4px;font-size:16px}
.mvsheet p{margin:0 18px 8px;font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.list .row{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.row.lp-wait{transition:transform .45s;transform:scale(.98)}
.dragging{position:relative;z-index:5;box-shadow:0 10px 28px rgba(15,39,66,.28);outline:2px solid var(--accent);transition:none!important;opacity:.97}
.steps .step{-webkit-user-select:none;user-select:none}
.step .sh{border:0;background:none;color:var(--muted);font-size:20px;line-height:1;cursor:grab;touch-action:none;padding:0}
@media (max-width:420px){.counters{gap:6px}.cnt b{font-size:16px}.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header><div class="hl"><button class="burger" id="btnMenu" aria-label="Бөлімдер">☰</button><h1>Бақылау</h1></div><div class="hbtns"><button class="hbtn" id="btnOrder">Реттеу</button><button class="hbtn" id="btnSettings">Баптау</button></div></header>
  <div class="ordhint" id="ordHint" hidden>Реттеу режимі: көрсеткілермен блоктарды, бөлімдерді және істерді жылжытыңыз. Біткенде «Дайын» басыңыз.</div>
  <div class="sync"><span class="dot" id="syncDot"></span><span id="syncText">—</span></div>
  <div class="counters" id="counters"></div>
  <div class="chips" id="chips"></div>
  <div class="chips sub" id="subchips" hidden></div>
  <input class="search" id="q" type="search" placeholder="Іздеу: аты, сот, нөмір…" autocomplete="off">
  <div class="list" id="list"></div>
</div>
<button class="fab" id="fab" aria-label="Жаңа іс">+</button>
<div class="dimmer" id="dimmer" hidden></div>
<nav class="drawer" id="drawer" aria-label="Бөлімдер"></nav>
<div class="mvsheet" id="mvsheet" hidden></div>
<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
const SECTIONS=[
  {id:"sot",name:"Соттағы істер"},
  {id:"qalpyna",name:"Төлем қабілеттілігін қалпына келтіру"},
  {id:"onai",name:"Оңайлатылған шешімнің күшін жою"},
  {id:"talap",name:"Менің талап арыздарым"},
  {id:"otbasy",name:"Отбасылық істер"},
  {id:"suraular",name:"Жіберілген сұраулар"},
  {id:"grafik",name:"График алу"},
  {id:"bankrot",name:"Соттан тыс банкроттық"},
  {id:"jumys",name:"Жұмыссыздық жәрдемақысы"},
  {id:"fu",name:"Қаржы басқарушысы ретінде"},
  {id:"shart",name:"Шарттар тізілімі"},
  {id:"ister",name:"Істер"},
  {id:"naraz",name:"Наразылық болуы мүмкін"}
];
const SHORT={all:"Барлығы",closed:"Жабылған",sot:"Сот",qalpyna:"Қалпына келтіру",onai:"Оңайлатылған",talap:"Талап арыздар",otbasy:"Отбасы",suraular:"Сұраулар",grafik:"График",bankrot:"Банкрот",jumys:"Жұмыссыз",fu:"Қаржы бас.",shart:"Шарттар",ister:"Істер",naraz:"Наразылық"};
const STATUSES=["Жұмыста","Жауап күтуде","Шешім шықты","Жабылды"];
const PRI=[{v:0,n:"Жоқ"},{v:1,n:"Төмен"},{v:2,n:"Орта"},{v:3,n:"Жоғары"}];
const K={cases:"baqylau.cases",cfg:"baqylau.cfg",dirty:"baqylau.dirty",last:"baqylau.lastSync"};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const secName=id=>(SECTIONS.find(s=>s.id===id)||{name:id||"Істер"}).name;
const nowISO=()=>new Date().toISOString();
const ts=s=>{const t=Date.parse(s||"");return isNaN(t)?0:t};

/* ---------- local store ---------- */
function load(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){toast("Телефон жадына сақталмады")}}
let all=load(K.cases,[]);           // includes tombstones {deleted:true}
let cfg=load(K.cfg,{owner:"Aseke139",repo:"baqylau-data",path:"data.json",token:""});
let dirty=load(K.dirty,false);
let lastSync=load(K.last,"");
let view={counter:"all",section:"all",q:""};
let zoom=load("baqylau.zoom",115);function applyZoom(){document.body.style.zoom=zoom+"%"}applyZoom();
let ordering=false;
const CNT={over:{n:"Мерзімі өтті",cls:"red"},today:{n:"Бүгін",cls:"amber"},week:{n:"7 күн ішінде",cls:""},all:{n:"Ашық істер",cls:""}};
const SUBS=["qalpyna","onai","talap","otbasy"];
const inSec=(c,id)=>id==="sot"?(c.section==="sot"||SUBS.includes(c.section)):id==="sot0"?c.section==="sot":c.section===id;
const inSot=id=>id==="sot"||id==="sot0"||SUBS.includes(id);
let layout=load("baqylau.layout",{});
function fixLayout(){
  const ck=Object.keys(CNT),sk=["all",...SECTIONS.map(x=>x.id).filter(x=>!SUBS.includes(x)),"closed"];
  layout.counters=(layout.counters||[]).filter(k=>ck.includes(k));ck.forEach(k=>{if(!layout.counters.includes(k))layout.counters.push(k)});
  layout.chips=(layout.chips||[]).filter(k=>sk.includes(k));sk.forEach(k=>{if(!layout.chips.includes(k))layout.chips.push(k)});
}
fixLayout();
function moveIn(arr,k,d){const i=arr.indexOf(k),j=i+d;if(i<0||j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]];store("baqylau.layout",layout);render()}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

const live=()=>all.filter(c=>!c.deleted);
function saveLocal(markDirty=true){store(K.cases,all);if(markDirty){dirty=true;store(K.dirty,true);scheduleSync()}renderSync()}

/* ---------- dates ---------- */
function todayStart(){const d=new Date();d.setHours(0,0,0,0);return d}
function parseDue(s){if(!s)return null;const d=new Date(s.length===10?s+"T09:00":s);return isNaN(d)?null:d}
function dayDiff(d){const b=new Date(d);b.setHours(0,0,0,0);return Math.round((b-todayStart())/86400000)}
function fmtDue(d){const p=n=>String(n).padStart(2,"0");const y=d.getFullYear()===new Date().getFullYear()?"":"."+String(d.getFullYear()).slice(2);return p(d.getDate())+"."+p(d.getMonth()+1)+y+" "+p(d.getHours())+":"+p(d.getMinutes())}
function relText(n){if(n===0)return"⏰ Бүгін";if(n===1)return"⏰ Ертең";if(n<0)return"⚠ "+Math.abs(n)+" күн өтті";if(n<=2)return"⏰ "+n+" күн қалды";return n+" күн қалды"}
const isClosed=c=>c.status==="Жабылды";
function urgency(c){if(isClosed(c))return"done";const d=parseDue(c.due);if(!d)return"none";const n=dayDiff(d);return n<0?"over":n<=2?"soon":"ok"}
function counterMatch(c,k){
  if(k==="closed")return isClosed(c);
  if(isClosed(c))return false;
  if(k==="all")return true;
  const d=parseDue(c.due);if(!d)return false;const n=dayDiff(d);
  return k==="over"?n<0:k==="today"?n===0:k==="week"?(n>=0&&n<=7):true;
}
function filtered(){
  const q=view.q.trim().toLowerCase();
  return live().filter(c=>counterMatch(c,view.counter)&&(view.section==="all"||inSec(c,view.section))&&(!q||[c.title,c.phone,c.desc,secName(c.section)].join(" ").toLowerCase().includes(q)))
   .sort(cmp);
}
function baseCmp(a,b){const p=(b.priority||0)-(a.priority||0);if(p)return p;const da=parseDue(a.due),db=parseDue(b.due);if(da&&db)return da-db;if(da)return -1;if(db)return 1;return String(a.title).localeCompare(String(b.title))}
function cmp(a,b){const ha=typeof a.order==="number",hb=typeof b.order==="number";if(ha&&hb)return a.order-b.order;if(ha)return 1;if(hb)return -1;return baseCmp(a,b)}
function ensureOrder(){const L=live();if(L.every(c=>typeof c.order==="number"))return;const t=nowISO();L.sort(cmp).forEach((c,i)=>{c.order=i+1;c.updated=t});saveLocal()}
function moveCase(id,d){const F=filtered();const i=F.findIndex(c=>c.id===id),j=i+d;if(i<0||j<0||j>=F.length)return;const a=F[i],b=F[j],t=nowISO();[a.order,b.order]=[b.order,a.order];if(a.order===b.order)a.order+=d;a.updated=t;b.updated=t;saveLocal();render()}

/* ---------- render ---------- */
function render(){
  const L=live();
  $("btnOrder").textContent=ordering?"Дайын":"Реттеу";$("btnOrder").classList.toggle("on",ordering);$("ordHint").hidden=!ordering;
  $("counters").innerHTML=layout.counters.map(k=>{const x=CNT[k];const inner=`<b>${L.filter(c=>counterMatch(c,k)).length}</b><span>${x.n}</span>`;
    return ordering?`<div class="cnt ${x.cls}">${inner}<div class="mv"><button data-mc="${k}" data-d="-1" aria-label="Солға">←</button><button data-mc="${k}" data-d="1" aria-label="Оңға">→</button></div></div>`
                   :`<button class="cnt ${x.cls}" data-k="${k}" aria-pressed="${view.counter===k}">${inner}</button>`}).join("");
  const base=L.filter(c=>counterMatch(c,view.counter));
  $("chips").innerHTML=layout.chips.map(id=>{
    const name=SHORT[id]||secName(id);
    const n=id==="all"?base.length:id==="closed"?L.filter(isClosed).length:base.filter(c=>inSec(c,id)).length;

let lpFired=false,holdAt=0;
function makeDrag(box,itemSel,o){
  let el=null,timer=null,active=false,moved=false,sx=0,sy=0,grabY=0,from=-1;
  const items=()=>[...box.querySelectorAll(itemSel)];
  const pt=e=>e.touches?e.touches[0]:e;
  function start(e){
    const it=e.target.closest(itemSel);if(!it||!box.contains(it))return;
    const onHandle=o.handleSel&&e.target.closest(o.handleSel);
    if(o.handleSel&&o.handleOnly&&!onHandle)return;
    if(e.type==="mousedown"&&e.button!==0)return;
    const p=pt(e);sx=p.clientX;sy=p.clientY;el=it;moved=false;
    const go=()=>{timer=null;active=true;from=items().indexOf(el);const r=el.getBoundingClientRect();grabY=sy-r.top;el.classList.add("dragging");try{navigator.vibrate&&navigator.vibrate(25)}catch(_){}};
    if(onHandle){e.preventDefault();go()}else{el.classList.add("lp-wait");timer=setTimeout(go,o.delay||450)}
  }
  function move(e){
    if(!el)return;const p=pt(e);
    if(!active){if(Math.hypot(p.clientX-sx,p.clientY-sy)>6)cancel();return}
    if(e.type==="touchmove"&&!e.cancelable){abort();return}
    e.preventDefault();
    if(Math.abs(p.clientY-sy)>6)moved=true;
    el.style.transform="";
    const list=items();
    for(const sib of list){if(sib===el)continue;const r=sib.getBoundingClientRect(),mid=r.top+r.height/2;
      const before=list.indexOf(sib)<list.indexOf(el);
      if(before&&p.clientY<mid){box.insertBefore(el,sib);break}
      if(!before&&p.clientY>mid){box.insertBefore(el,sib.nextSibling)}}
    const r=el.getBoundingClientRect();el.style.transform=`translateY(${p.clientY-grabY-r.top}px)`;
    if(p.clientY<70)window.scrollBy(0,-12);else if(p.clientY>innerHeight-90)window.scrollBy(0,12);
    if(o.scroller){if(p.clientY<90)o.scroller.scrollTop-=12;else if(p.clientY>innerHeight-90)o.scroller.scrollTop+=12}
  }
  function end(e){
    if(!el)return;const wasActive=active,it=el,to=items().indexOf(el);
    if(wasActive&&e&&e.cancelable&&e.type==='touchend')e.preventDefault();
    clearTimeout(timer);timer=null;el.classList.remove("dragging","lp-wait");el.style.transform="";el=null;active=false;
    if(!wasActive)return;
    lpFired=true;setTimeout(()=>lpFired=false,400);
    if(moved&&to!==from)o.onDrop(from,to,it);else if(!moved&&o.onHold)o.onHold(it);else if(o.onCancel)o.onCancel();
  }
  function cancel(){clearTimeout(timer);timer=null;if(el)el.classList.remove("lp-wait");el=null;active=false}
  function abort(){const was=active;clearTimeout(timer);timer=null;if(el){el.classList.remove("dragging","lp-wait");el.style.transform=""}el=null;active=false;if(was&&o.onCancel)o.onCancel()}
  const onScroll=()=>{if(el&&!active)cancel()};window.addEventListener("scroll",onScroll,{passive:true});if(o.scroller)o.scroller.addEventListener("scroll",onScroll,{passive:true});
  box.addEventListener("touchstart",start,{passive:false});box.addEventListener("mousedown",start);
  box.addEventListener("touchmove",move,{passive:false});window.addEventListener("mousemove",e=>{if(el)move(e)});
  box.addEventListener("touchend",end);box.addEventListener("touchcancel",end);window.addEventListener("mouseup",()=>{if(el)end()});
}

/* ---------- merge & sync ---------- */
function mergeIn(list){
  let n=0;const map=new Map(all.map(c=>[c.id,c]));
  for(const r of (list||[])){if(!r||!r.id)continue;const l=map.get(r.id);if(!l||ts(r.updated)>ts(l.updated)){map.set(r.id,r);n++}}
  all=[...map.values()];return n;
}
function b64ToText(b){const bin=atob(b.replace(/\n/g,""));const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder().decode(u)}
function textToB64(t){const u=new TextEncoder().encode(t);let s="";for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}
const api=()=>`https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/contents/${cfg.path||"data.json"}`;
const hdr=()=>({"Authorization":"Bearer "+cfg.token,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"});
let syncing=false,syncTimer=null;
function scheduleSync(){clearTimeout(syncTimer);syncTimer=setTimeout(()=>syncNow(),1500)}
async function syncNow(loud){
  if(!cfg.token||syncing||!navigator.onLine){renderSync();return}
  syncing=true;renderSync("busy");
  try{
    for(let attempt=0;attempt<2;attempt++){
      const r=await fetch(api()+"?t="+Date.now(),{headers:hdr(),cache:"no-store"});
      let sha=null,remote=[];
      if(r.status===200){const j=await r.json();sha=j.sha;const txt=b64ToText(j.content||"");remote=txt.trim()?(JSON.parse(txt).cases||[]):[]}
      else if(r.status!==404){throw new Error(r.status===401?"Токен жарамсыз":r.status===403?"Рұқсат жоқ (токен құқығын тексеріңіз)":"GitHub қатесі "+r.status)}
      const before=JSON.stringify(sortById(remote));
      mergeIn(remote);
      const merged=sortById(all);
      if(JSON.stringify(merged)!==before){
        const body={message:"Бақылау: синхрондау "+new Date().toISOString(),content:textToB64(JSON.stringify({version:1,updated:nowISO(),cases:merged},null,1))};
        if(sha)body.sha=sha;
        const p=await fetch(api(),{method:"PUT",headers:{...hdr(),"Content-Type":"application/json"},body:JSON.stringify(body)});
        if(p.status===409||p.status===422){continue}
        if(!p.ok)throw new Error("Жіберілмеді: "+p.status);
      }
      store(K.cases,all);dirty=false;store(K.dirty,false);lastSync=nowISO();store(K.last,lastSync);
      syncing=false;render();renderSync();if(loud)toast("Синхрондалды");return;
    }
    throw new Error("Қайта көріңіз");
  }catch(e){syncing=false;renderSync("err",e.message||"Байланыс қатесі");if(loud)toast(e.message||"Қате")}
}
function sortById(a){return [...a].sort((x,y)=>x.id<y.id?-1:x.id>y.id?1:0)}

window.addEventListener("online",()=>syncNow());
window.addEventListener("offline",()=>renderSync());
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){render();syncNow()}});
setInterval(()=>{if(document.visibilityState==="visible")syncNow()},120000);
setInterval(render,60000);
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").then(r=>r.update()).catch(()=>{});let reloaded=false;navigator.serviceWorker.addEventListener("controllerchange",()=>{if(reloaded)return;reloaded=true;location.reload()})}
render();renderSync();syncNow();
</script>
</body>
